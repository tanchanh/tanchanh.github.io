  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-blue: #0066B6;
      --color-purple: #4020D0;
      --color-lime: #7FDD0F;
      --color-green: #009911;
      --color-orange: #EE6000;
      --color-red: #FF2040;
      --color-black: #000000;
      --color-dark-1: #1A1A1A;
      --color-dark-2: #262626;
      --color-gray: #CCCCCC;
      --color-white: #FFFFFF;

      --theme-navy: #021B35;
      --theme-brand-blue: #0066B6;
      --theme-sky-blue: #8DBDF0;
      --theme-grid-line: #E4EDF5;
      --theme-outer-bg: #E6EDF5;

      --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      font-family: var(--font-stack);
      font-size: 1.1rem;
      font-weight: normal;
      background-color: var(--theme-outer-bg);
      color: var(--theme-navy);
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      word-break: normal;
      overflow-wrap: break-word;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* KHUNG THẺ ĐỊNH DANH (NỔI BẬT 3D TRÊN NỀN XÁM BẠC, GÓC VUÔNG 90 ĐỘ NGUYÊN BẢN) */
    .id-card-container {
      position: relative;
      width: 100%;
      max-width: 24.5rem;
      background-color: var(--color-white);
      box-shadow: 0 1rem 3rem rgba(2, 27, 53, 0.16);
      margin: 0 auto;
      overflow: clip;
      isolation: isolate;
      display: flex;
      flex-direction: column;
    }

    /* HỆ THỐNG LƯỚI NỀN Ô LỚN PHỦ TOÀN BỘ PHÍA SAU THẺ */
    .svg-full-card-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* KHU VỰC ĐỈNH THẺ: KHÓA TỈ LỆ ASPECT-RATIO ĐỒNG DẠNG (CHỐNG MÉO HÌNH TUYỆT ĐỐI) */
    .card-top-section {
      position: relative;
      width: 100%;
      aspect-ratio: 376 / 312;
      height: auto;
      background-color: transparent;
      z-index: 1;
    }

    .svg-top-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* TÊN CÔNG TY TIDA: CỐ ĐỊNH 1.4rem */
    .brand-container {
      position: absolute;
      top: 8%;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-text {
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 0.2rem;
      color: var(--color-white);
      text-transform: uppercase;
    }

    /* KHUNG ẢNH CHÂN DUNG CO GIÃN THEO TỈ LỆ % ĐỒNG BỘ VỚI ĐỈNH THẺ */
    .hexagon-portrait-box {
      position: absolute;
      top: 25.6%;
      left: 50%;
      transform: translateX(-50%);
      width: 47.87%;
      height: 66.67%;
      z-index: 3;
    }

    .hexagon-svg-border {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .hexagon-image-clip {
      position: absolute;
      top: 3.8%;
      left: 4.4%;
      width: 91.2%;
      height: 92.4%;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background-color: var(--theme-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1;
    }

    .user-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-fallback-icon {
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background-color: var(--theme-navy);
    }

    .avatar-fallback-icon svg {
      width: 50%;
      height: 50%;
      fill: var(--theme-sky-blue);
      opacity: 0.85;
    }

    /* PHẦN THÂN THẺ (PADDING-TOP: 0, ĐỆM ĐÁY 4.5rem CÁCH XA KHỐI QR) */
    .card-body-section {
      position: relative;
      background-color: transparent;
      padding: 0 1.25rem 4.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    /* HỌ TÊN CHỦ THẺ: ÁP SÁT TRỰC TIẾP NGAY DƯỚI ẢNH ĐẠI DIỆN (-0.8rem), CỐ ĐỊNH 1.5rem */
    .card-holder-name {
      position: relative;
      z-index: 1;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--theme-navy);
      text-align: center;
      margin-top: -0.8rem;
      margin-bottom: 1.3rem;
      letter-spacing: -0.01rem;
    }

    /* DANH SÁCH LIÊN HỆ ĐỒNG BỘ CĂN GIỮA HAI LỀ */
    .contact-info-list {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.15rem;
      width: 100%;
    }

    .contact-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.3rem;
      width: 100%;
    }

    /* TIÊU ĐỀ MỤC: FONT 1.1rem (CHỮ ĐẬM) */
    .contact-block-label {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--theme-brand-blue);
      letter-spacing: 0.02rem;
    }

    /* HÀNG HIỂN THỊ CÙNG DÒNG "GIÁ TRỊ - QR CODE" */
    .contact-inline-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    /* NỘI DUNG BÊN DƯỚI: FONT 1.1rem (CHỮ THƯỜNG) */
    .contact-block-link {
      font-size: 1.1rem;
      font-style: normal;
      font-weight: normal;
      color: var(--theme-navy);
      text-decoration: none;
      word-break: break-all;
      transition: color 0.15s;
    }

    .contact-block-link:hover, .contact-block-link:focus {
      color: var(--theme-brand-blue);
      text-decoration: underline;
    }

    /* DẤU GẠCH NỐI " - " */
    .contact-inline-separator {
      font-size: 1.1rem;
      font-style: normal;
      font-weight: normal;
      color: var(--theme-navy);
      user-select: none;
    }

    /* NÚT VĂN BẢN "QR Code" CHUẨN NGỮ NGHĨA */
    .contact-qr-link {
      font-family: inherit;
      font-size: 1.1rem;
      font-style: normal;
      font-weight: normal;
      color: var(--theme-brand-blue);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.15s;
      display: inline-block;
    }

    .contact-qr-link:hover, .contact-qr-link:focus {
      color: var(--theme-navy);
    }

    /* ĐÁY THẺ */
    .card-footer-section {
      position: relative;
      width: 100%;
      height: 4.6rem;
      background-color: transparent;
      overflow: visible;
      z-index: 2;
    }

    .svg-footer-ribbon {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* NÚT QR CODE ĐÁY THẺ: MÃ WEBSITE LIÊN HỆ, NÂNG CAO LÊN BOTTOM: 1.8rem, VIỀN 6PX, PADDING 0, GÓC VUÔNG PHẲNG */
    .qr-badge-button {
      position: absolute;
      right: 1.5rem;
      bottom: 1.8rem;
      width: 5.2rem;
      height: 5.2rem;
      aspect-ratio: 1 / 1;
      background-color: var(--color-white);
      border: 6px solid var(--theme-brand-blue);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0.5rem 1.25rem rgba(0, 0, 0, 0.35);
      transition: transform 0.2s, border-color 0.2s;
      z-index: 5;
    }

    .qr-badge-button:hover {
      transform: translateY(-4px);
      border-color: var(--theme-sky-blue);
    }

    .qr-code-svg-image {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      object-fit: contain;
      pointer-events: none;
    }

    /* LỚP PHỦ POPUP: DÙNG DISPLAY: NONE / GRID, Z-INDEX CAO TUYỆT ĐỐI */
    .qr-modal-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: rgba(2, 27, 53, 0.88);
      z-index: 99999;
      display: none;
      place-items: center;
      padding: 1rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .qr-modal-overlay.open {
      display: grid;
    }

    /* KHUNG THẺ POPUP NẰM CHÍNH GIỮA MÀN HÌNH */
    .qr-modal-card {
      position: relative;
      background-color: var(--color-white);
      border: 4px solid var(--theme-brand-blue);
      border-radius: 1.25rem;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 1rem 3rem rgba(0,0,0,0.3);
      width: min(90vw, 20rem);
      margin: auto;
      box-sizing: border-box;
    }

    /* NÚT ĐÓNG CHUẨN 44px (2.75rem) DỄ BẤM */
    .qr-modal-close-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      border: 2px solid var(--theme-brand-blue);
      background-color: var(--theme-navy);
      color: var(--color-white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background-color 0.2s, transform 0.15s;
    }

    .qr-modal-close-btn:hover {
      background-color: var(--color-red);
      transform: scale(1.08);
    }

    .qr-modal-close-btn svg {
      width: 1.4rem;
      height: 1.4rem;
      stroke: currentColor;
    }

    /* TIÊU ĐỀ POPUP */
    .qr-modal-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--theme-navy);
      margin-top: 0.25rem;
      margin-bottom: 0.75rem;
      text-align: center;
      white-space: nowrap;
    }

    /* KHUNG CHỨA QR DÙNG CHUNG CO DÃN ĐA CHIỀU (CHỐNG TRÀN) */
    .qr-modal-image-wrapper {
      width: min(68vw, 45vh, 14rem);
      height: min(68vw, 45vh, 14rem);
      aspect-ratio: 1 / 1;
      background-color: var(--color-white);
      padding: 0.4rem;
      border: 2px solid var(--theme-grid-line);
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .qr-modal-image-wrapper svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
      object-fit: contain;
    }

    .qr-modal-action-link {
      font-size: 1.15rem;
      font-style: normal;
      font-weight: bold;
      color: var(--theme-brand-blue);
      text-decoration: none;
      margin-top: 0.75rem;
      display: inline-flex;
      align-items: center;
      transition: color 0.15s;
    }

    .qr-modal-action-link:hover {
      text-decoration: underline;
      color: var(--theme-navy);
    }

    .qr-modal-hint {
      font-size: 0.85rem;
      color: #666666;
      margin-top: 0.2rem;
      text-align: center;
    }
  </style>
</head>

  <script>
    (function () {
      "use strict";
      const avatarImg = document.getElementById("avatar-image-element");
      const fallbackBox = document.getElementById("avatar-svg-box");
      function showLoadedAvatar(){ if(!avatarImg||!fallbackBox) return; avatarImg.style.display="block"; fallbackBox.style.display="none"; }
      function showFallbackAvatar(){ if(!avatarImg||!fallbackBox) return; avatarImg.style.display="none"; fallbackBox.style.display="flex"; }
      if(avatarImg){
        avatarImg.addEventListener("load", showLoadedAvatar);
        avatarImg.addEventListener("error", showFallbackAvatar);
        if(avatarImg.complete){ if(avatarImg.naturalWidth>0) showLoadedAvatar(); else showFallbackAvatar(); }

      const qrDataStore = {

      };
      const modalOverlay = document.getElementById("qr-modal-overlay");
      const modalBox = document.getElementById("qr-modal-card-box");
      const modalTitle = document.getElementById("modal-qr-title");
      const modalSvgTarget = document.getElementById("modal-qr-svg-target");
      const modalActionLink = document.getElementById("modal-qr-action-link");
      const btnCloseQr = document.getElementById("btn-close-qr");
      const btnFooterQr = document.getElementById("btn-footer-qr");
      if(!modalOverlay || !modalBox || !modalTitle || !modalSvgTarget || !modalActionLink) return;
      let prevOverflow = "";
      let prevActiveElement = null;
      function renderQrFromTemplate(templateId, targetEl){
        if(!targetEl) return;
        targetEl.innerHTML = "";
        const tpl = document.getElementById(templateId);
        if(tpl && tpl.content){ targetEl.appendChild(tpl.content.cloneNode(true)); }
      }
      const footerMount = document.getElementById("footer-qr-mount");
      if(footerMount){ renderQrFromTemplate("qr-contact", footerMount); }
      function openQrModal(type){
        const data = qrDataStore[type] || qrDataStore.contact;
        prevActiveElement = document.activeElement;
        prevOverflow = document.body.style.overflow;
        modalTitle.textContent = data.title;
        renderQrFromTemplate(data.templateId, modalSvgTarget);
        modalActionLink.textContent = data.linkText;
        modalActionLink.href = data.linkHref;
        modalActionLink.target = data.target;
        modalActionLink.rel = data.target === "_blank" ? "noopener noreferrer" : "";
        modalOverlay.classList.add("open");
        modalOverlay.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";

      }
      function closeQrModal(){
        modalOverlay.classList.remove("open");
        modalOverlay.setAttribute("aria-hidden", "true");
        document.body.style.overflow = prevOverflow;
        if(prevActiveElement && typeof prevActiveElement.focus === "function"){ prevActiveElement.focus(); }
      }
      document.querySelectorAll(".contact-qr-link").forEach(function (button){
        button.addEventListener("click", function (e){
          e.preventDefault(); e.stopPropagation();
          openQrModal(button.getAttribute("data-qr"));
        });
      });
      btnFooterQr?.addEventListener("click", function (e){ e.preventDefault(); e.stopPropagation(); openQrModal("contact"); });
      modalBox.addEventListener("click", function (e){ e.stopPropagation(); });
      btnCloseQr?.addEventListener("click", function (e){ e.preventDefault(); closeQrModal(); });
      modalOverlay.addEventListener("click", function (e){ if(e.target === modalOverlay) closeQrModal(); });
      window.addEventListener("keydown", function (e){ if(e.key === "Escape" && modalOverlay.classList.contains("open")) closeQrModal(); });
    })();
  </script>
